media:
  input: src/app/media
  output: /app/media
content:
  - name: posts
    label: Posts
    type: collection
    path: src/content/posts
    fields:
      - name: title
        type: string
      - name: body
        type: rich-text
  - name: site
    label: Site settings
    type: file
    path: src/shared/config/site.json
    fields:
      - name: title
        type: string
      - name: description
        type: text
      - name: url
        type: string
